[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "../deployments" }]

remappings = [
  "@reactive/=lib/reactive-lib-omni/",
  "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 120
